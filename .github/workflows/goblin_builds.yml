name: "👾 Goblin Builds"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf8

jobs:
  windows-editor:
    name: "Windows editor"
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Install Pillow (for multi-res ICO generation)
        shell: sh
        run: python -m pip install Pillow

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build windows editor
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: editor
          scons-flags: >-
            dev_mode=no
            debug_symbols=no
            module_text_server_fb_enabled=yes
            module_mono_enabled=no
            windows_subsystem=console
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            "angle_libs=${{ github.workspace }}/"
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}

      - name: Extract version config for templates
        shell: pwsh
        run: |
          $script = @'
          import importlib.util
          import pathlib
          spec = importlib.util.spec_from_file_location("godot_version", "version.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          parts = [str(mod.major), str(mod.minor)]
          patch = getattr(mod, "patch", 0)
          if patch:
            parts.append(str(patch))
          parts.append(str(mod.status))
          module_config = str(getattr(mod, "module_config", "") or "")
          if module_config:
            parts.append(module_config)
          version = ".".join(parts)
          pathlib.Path("version_config.txt").write_text(version, encoding="utf-8")
          print(f"Wrote version_config.txt with: {version}")
          '@
          $script = [System.Text.RegularExpressions.Regex]::Replace($script, '(?m)^ {10}', '')
          python -c $script

      - name: Upload version config
        uses: actions/upload-artifact@v4
        with:
          name: version-config
          path: version_config.txt

      - name: Upload windows editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-editor
          path: bin/
          exclude: |
            build_deps/**
            *.exp
            *.lib

  windows-templates:
    name: "Windows templates"
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Install Pillow (for multi-res ICO generation)
        shell: sh
        run: python -m pip install Pillow

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build windows template_release
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: template_release
          scons-flags: >-
            dev_mode=no
            debug_symbols=no
            module_text_server_fb_enabled=yes
            module_mono_enabled=no
            d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
            "angle_libs=${{ github.workspace }}/"
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}

      - name: Stage windows template files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $tmpl = Get-ChildItem -Path bin -Filter "*.exe" | Where-Object { $_.Name -match "goblin" -and $_.Name -match "windows\.template_release\.x86_64" -and $_.Name -notmatch "\.console\.exe$" } | Select-Object -First 1
          if (-not $tmpl) {
            $tmpl = Get-ChildItem -Path bin -Filter "*.exe" | Where-Object { $_.Name -match "goblin" -and $_.Name -match "windows\.template_release\.x86_64" } | Select-Object -First 1
          }
          if (-not $tmpl) { throw "Could not find a goblin windows template_release exe in ./bin" }
          Copy-Item $tmpl.FullName out\windows_release_x86_64.exe -Force

      - name: Upload windows templates payload
        uses: actions/upload-artifact@v4
        with:
          name: templates-windows
          path: out/

  linux-templates:
    name: "Linux templates"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libwayland-bin

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build linux template_release
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: template_release
          scons-flags: >-
            dev_mode=no
            debug_symbols=no
            module_text_server_fb_enabled=yes
            module_mono_enabled=no
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}

      - name: Stage linux template files
        shell: bash
        run: |
          mkdir -p out
          tmpl=$(ls -1 bin/goblin.linuxbsd.template_release.x86_64* 2>/dev/null | head -n1)
          if [ -z "$tmpl" ]; then
            echo "::error::Could not find a goblin linux template_release x86_64 binary in ./bin"
            exit 1
          fi
          cp "$tmpl" out/linux_release.x86_64
          chmod +x out/linux_release.x86_64

      - name: Upload linux templates payload
        uses: actions/upload-artifact@v4
        with:
          name: templates-linux
          path: out/

  macos-templates:
    name: "macOS templates"
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS: Vulkan SDK installation failed, building without Vulkan support."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Build macOS template_release (universal)
        shell: bash
        run: |
          python -V
          scons -j2 platform=macos target=template_release arch=x86_64 module_mono_enabled=no module_text_server_fb_enabled=yes dev_mode=no debug_symbols=no generate_bundle=yes vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
          scons -j2 platform=macos target=template_release arch=arm64 module_mono_enabled=no module_text_server_fb_enabled=yes dev_mode=no debug_symbols=no generate_bundle=yes vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}

      - name: Stage macOS template zip
        shell: bash
        run: |
          mkdir -p out
          zipfile=$(find bin -maxdepth 1 -type f -name "*macos*.zip" | head -n1)
          if [ -z "$zipfile" ]; then
            zipfile=$(find bin -maxdepth 1 -type f -name "*.zip" | head -n1)
          fi
          if [ -n "$zipfile" ]; then
            cp "$zipfile" out/macos.zip
          elif [ -d "bin/macos_template.app" ]; then
            (cd bin && zip -r ../out/macos.zip macos_template.app)
          fi
          if [ ! -f out/macos.zip ]; then
            echo "::error::Could not find or create a macOS templates zip in ./bin"
            ls -la bin || true
            exit 1
          fi

      - name: Upload macOS templates payload
        uses: actions/upload-artifact@v4
        with:
          name: templates-macos
          path: out/

  web-templates:
    name: "Web templates"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.11
          no-cache: true

      - name: Verify Emscripten setup
        run: emcc -v

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Build web template
        uses: ./.github/actions/godot-build
        with:
          platform: web
          target: template_release
          scons-flags: >-
            dev_mode=no
            debug_symbols=no
            module_text_server_fb_enabled=yes
            module_mono_enabled=no
            use_closure_compiler=yes
            threads=no arch=wasm32

      - name: Stage web template files
        shell: bash
        run: |
          mkdir -p out
          zipfile=$(ls -1 bin/godot.web*template_release*.zip 2>/dev/null | head -n1)
          if [ -z "$zipfile" ]; then
            echo "::error::Could not find a goblin web template_release zip in ./bin"
            ls -la bin || true
            exit 1
          fi
          cp "$zipfile" out/web_nothreads_release.zip

      - name: Upload web templates payload
        uses: actions/upload-artifact@v4
        with:
          name: templates-web
          path: out/

  package-tpz:
    name: "Package export templates (.tpz)"
    runs-on: ubuntu-22.04
    needs: [windows-templates, linux-templates, macos-templates, web-templates, windows-editor]
    steps:
      - name: Download templates payloads
        uses: actions/download-artifact@v4
        with:
          pattern: templates-*
          path: payloads
          merge-multiple: false

      - name: Download version config
        uses: actions/download-artifact@v4
        with:
          name: version-config
          path: payloads/version

      - name: Build tpz
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat payloads/version/version_config.txt)
          mkdir -p tpz
          echo "$version" > tpz/version.txt
          cp payloads/templates-windows/windows_release_x86_64.exe tpz/windows_release_x86_64.exe
          cp payloads/templates-linux/linux_release.x86_64 tpz/linux_release.x86_64
          cp payloads/templates-macos/macos.zip tpz/macos.zip
          cp payloads/templates-web/web_nothreads_release.zip tpz/web_nothreads_release.zip
          (cd tpz && zip -r ../goblin_export_templates.tpz .)

      - name: Upload tpz artifact
        uses: actions/upload-artifact@v4
        with:
          name: goblin-export-templates-tpz
          path: goblin_export_templates.tpz
